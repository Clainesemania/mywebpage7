<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claine | Portfolio</title>
    <link rel="preload" as="image" href="images/pic01.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Define color palette inspired by the image */
        :root {
            --navy-grey: #2d3e4f; /* Derived from the image's wall color */
            --white-gold: #c5a059; /* Metallic gold from the console and mirror frame */
            --light-cream: #f4efe7; /* Cream color from the stool */
            --off-white: #fafafa; /* Background white */
            --transition-speed: 0.6s;
            --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94); /* Smooth ease-out for a premium feel */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', serif;
        }

        body {
            background-color: var(--off-white);
            color: var(--navy-grey);
            overflow: hidden; /* Prevent scrolling, controlled by JS sections */
            height: 100vh;
        }

        /* Flashlight Effect */
        #flashlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through */
            /* Start state */
            background: radial-gradient(circle 200px at 50% 50%, rgba(197, 160, 89, 0.15), transparent 80%);
            z-index: 1000;
        }

        /* Container to manage all sections */
        .scroller-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Base styling for all sections */
        section {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10%); /* Slide-in from bottom */
            transition: opacity var(--transition-speed) var(--ease), 
                        transform var(--transition-speed) var(--ease);
        }

        /* Class to show the current section */
        section.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Parallax Layer Styling */
        .parallax-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: transform 0.1s linear; /* Fast response for mouse parallax */
        }

        /* Section 1: Introduction - Using the wall color for the first layer */
        #intro .parallax-layer {
            background-color: var(--navy-grey);
            z-index: -2;
        }

        #intro h1 {
            font-size: 4rem;
            font-weight: 700;
            color: var(--white-gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
            margin-bottom: 0.5rem;
        }

        #intro p {
            font-size: 1.5rem;
            color: var(--light-cream);
        }

        /* Section 2: About - Transitioning colors */
        #about .parallax-layer {
            background-color: var(--white-gold);
            opacity: 0.2; /* Subtler texture */
        }

        #about h2 {
            font-size: 3rem;
            color: var(--white-gold);
            margin-bottom: 1rem;
        }

        .about-card {
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 1px solid rgba(197, 160, 89, 0.1);
            max-width: 500px;
        }

        .about-card h3 {
            color: var(--navy-grey);
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }

        .about-card p {
            color: #666;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        /* Project Section Styling */
        #gdevelop, #youtube, #github {
            color: #fff;
        }

        /* Image frame styling inspired by the gold console and circular mirror */
        .img-frame {
            border: 4px solid var(--white-gold);
            border-radius: 12px; /* Slight round like the stool/vases */
            padding: 10px;
            background-color: var(--off-white);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.2);
            margin-bottom: 1.5rem;
            transition: transform 0.3s var(--ease);
        }

        .img-frame:hover {
            transform: scale(1.05);
        }

        .img-frame img {
            display: block;
            border-radius: 8px; /* Inner radius for contrast */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            filter: grayscale(10%); /* Subtler feel */
        }

        /* Use images as background for project parallax layers to optimize */
        #gdevelop .parallax-layer {
            background-image: url('images/pic02.jpg'); /* Preloaded image for fast load */
            background-size: cover;
            opacity: 0.2;
        }
        
        #youtube .parallax-layer {
            background-image: url('images/pic03.jpg'); /* Not preloaded, but background images cache well */
            background-size: cover;
            opacity: 0.2;
        }

        #github .parallax-layer {
            background-image: url('images/pic04.jpg'); /* Not preloaded */
            background-size: cover;
            opacity: 0.2;
        }

        section h2 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
            margin-bottom: 1rem;
        }

        section p {
            color: rgba(255,255,255,0.8);
            max-width: 400px;
            font-size: 1.1rem;
        }

        /* Simple link button with gold and navy interaction */
        .gold-btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 10px 25px;
            background-color: transparent;
            color: var(--white-gold);
            border: 2px solid var(--white-gold);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: 0.3s var(--ease);
        }

        .gold-btn:hover {
            background-color: var(--white-gold);
            color: #fff;
            box-shadow: 0 0 15px rgba(197, 160, 89, 0.3);
        }

        /* Section 6: Still improving - Final section with wall color */
        #finish .parallax-layer {
            background-color: var(--navy-grey);
            opacity: 1;
            z-index: -2;
        }

        #finish h2 {
            color: var(--light-cream);
        }

        #finish p {
            color: var(--white-gold);
        }

    </style>
</head>
<body>

    <div class="parallax-layer-master" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: -1;"></div>

    <div class="scroller-container">

        <section id="intro" class="active">
            <div class="parallax-layer"></div> <h1>Claine</h1>
            <p>Welcome to my Portfolio</p>
        </section>

        <section id="about">
            <div class="parallax-layer"></div>
            <h2>About Me 😉</h2>
            <div class="about-grid" style="display: flex; gap: 1rem;">
                <div class="about-card">
                    <h3>Hobby ⭐</h3>
                    <p>Gaming, Reading, Music</p>
                </div>
                <div class="about-card">
                    <h3>Plans ⭐</h3>
                    <p>Graduate, then Job</p>
                </div>
            </div>
        </section>

        <section id="gdevelop">
            <div class="parallax-layer"></div>
            <div class="img-frame">
                <img src="images/pic02.jpg" alt="GDevelop Logo" width="120" height="120">
            </div>
            <h2>GDevelop</h2>
            <p>Game design on GitHub Pages</p>
            <a href="https://gd.games/games/6d9ac45b-3c74-42bd-abdd-4529e874b4f0" target="_blank" class="gold-btn">View →</a>
        </section>

        <section id="youtube">
            <div class="parallax-layer"></div>
            <div class="img-frame">
                <img src="images/pic03.jpg" alt="YouTube Gaming Content" width="120" height="120">
            </div>
            <h2>YouTube</h2>
            <p>Gaming content showcase</p>
            <a href="https://youtube.com/@hotdogpandesal-gaming?si=mxgZnGF4sPheFv-Z" target="_blank" class="gold-btn">View →</a>
        </section>

        <section id="github">
            <div class="parallax-layer"></div>
            <div class="img-frame">
                <img src="images/pic04.jpg" alt="GitHub Code Portfolio" width="120" height="120">
            </div>
            <h2>GitHub</h2>
            <p>Personal projects repository</p>
            <a href="https://github.com/Clainesemania" target="_blank" class="gold-btn">View →</a>
        </section>

        <section id="finish">
            <div class="parallax-layer"></div>
            <h2>Still Improving</h2>
            <p style="margin-top: 2rem;">A continuous journey</p>
        </section>

    </div>

    <div id="flashlight"></div>

    <script>
        // --- 1. Fast Loading Strategy ---
        // Preload only the primary images that appear in the first view to prioritize loading.
        // We do this via HTML tags in the head for max performance, but we can also use JS for complex loading.
        // Images not in the initial viewport will load naturally as the user scrolls.

        // --- 2. Parallax and Flashlight Mouse Interactions ---
        const flashlight = document.getElementById('flashlight');
        
        // Define intensity of parallax for each section. Section 1 is strongest for a powerful entry.
        const parallaxIntensities = [
            -0.03, // Section 1 (Wall): Stronger movement
             0.02, // Section 2 (About): Subtler movement
            -0.03, // Section 3 (GDevelop Image Layer)
            -0.03, // Section 4 (YouTube Image Layer)
            -0.03, // Section 5 (GitHub Image Layer)
            -0.03  // Section 6 (Finish): Solid again
        ];

        document.addEventListener('mousemove', (e) => {
            // Flashlight movement
            flashlight.style.setProperty('--x', e.clientX + 'px');
            flashlight.style.setProperty('--y', e.clientY + 'px');

            // Apply Parallax effect to the current active section's layer
            const activeParallaxLayer = document.querySelector('section.active .parallax-layer');
            if (activeParallaxLayer) {
                const currentIntensity = parallaxIntensities[currentIndex];
                const xShift = e.clientX * currentIntensity;
                const yShift = e.clientY * currentIntensity;
                activeParallaxLayer.style.transform = `translate3d(${xShift}px, ${yShift}px, 0)`; // translate3d is hardware-accelerated for speed
            }
        });

        // Ensure flashlight centers initially on non-mouse devices
        document.addEventListener('touchstart', (e) => {
            flashlight.style.setProperty('--x', e.touches[0].clientX + 'px');
            flashlight.style.setProperty('--y', e.touches[0].clientY + 'px');
        });

        // --- 3. Scroll and Navigation Control ---
        const sections = document.querySelectorAll('.scroller-container section');
        const container = document.querySelector('.scroller-container');
        let currentIndex = 0;
        let isScrolling = false; // Flag to prevent multiple scrolls at once

        // Function to smoothly transition to a specific section
        function scrollToSection(index) {
            if (isScrolling || index === currentIndex) return;
            isScrolling = true;

            // Hide the old section
            sections[currentIndex].classList.remove('active');
            
            // Wait for transition, then reset its parallax
            const oldLayer = sections[currentIndex].querySelector('.parallax-layer');
            if (oldLayer) {
                oldLayer.style.transform = 'translate3d(0,0,0)'; 
            }

            // Move to the new index
            currentIndex = index;
            
            // Show the new section
            sections[currentIndex].classList.add('active');

            // Set scrolling lock off after a delay matching the CSS transition
            setTimeout(() => {
                isScrolling = false;
            }, 650); // Slightly longer than transition speed
        }

        // Use Mouse Wheel for scrolling - Smooth and direct
        window.addEventListener('wheel', (e) => {
            if (isScrolling) return;

            if (e.deltaY > 0 && currentIndex < sections.length - 1) {
                // Scroll down
                scrollToSection(currentIndex + 1);
            } else if (e.deltaY < 0 && currentIndex > 0) {
                // Scroll up
                scrollToSection(currentIndex - 1);
            }
        });

        // Use Keyboard Arrows for accessibility
        window.addEventListener('keydown', (e) => {
            if (isScrolling) return;

            if (e.key === 'ArrowDown' && currentIndex < sections.length - 1) {
                scrollToSection(currentIndex + 1);
            } else if (e.key === 'ArrowUp' && currentIndex > 0) {
                scrollToSection(currentIndex - 1);
            }
        });

        // Use touch swipe for mobile parallax and section control
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        document.addEventListener('touchend', (e) => {
            if (isScrolling) return;

            const touchEndY = e.changedTouches[0].clientY;
            const yDiff = touchStartY - touchEndY;

            if (Math.abs(yDiff) > 50) { // Threshold for a swipe
                if (yDiff > 0 && currentIndex < sections.length - 1) {
                    // Swipe up
                    scrollToSection(currentIndex + 1);
                } else if (yDiff < 0 && currentIndex > 0) {
                    // Swipe down
                    scrollToSection(currentIndex - 1);
                }
            }
        });

    </script>
</body>
</html>
